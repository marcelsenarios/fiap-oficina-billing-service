server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: fiap-oficina-billing-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oficina_billing_db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

rabbitmq:
  exchange:
    billing: billing.events.exchange
    os: os.events.exchange
  queue:
    billing-os-events: billing.os.events.queue

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN:TEST-0000000000000000-000000-00000000000000000000000000000000-000000000}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:https://api.oficina.com/api/v1/webhook/mercadopago}
